# Production stack on the Vultr VPS: a one-shot migration, the bot, and the website
# behind Traefik. Uses the server's existing Postgres container (not its own).
# CI copies this file to ~/mutebetbot/compose.yaml on the server and runs `docker compose pull && docker compose up -d` (see .github/workflows/ci.yml).
# The server also needs ~/mutebetbot/.env with DATABASE_URL (host = the Postgres container's
# name), POSTGRES_NETWORK (the Docker network that container is on), and the Discord vars.
name: mutebetbot

services:
  # Runs migrations, then exits; the bot waits for it to succeed.
  migrate:
    image: sjc.vultrcr.com/chrisparsons/mutebetbot-bot:latest
    command: ["node", "packages/db/src/migrate.ts"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
    networks: [db]
    restart: "no"

  bot:
    image: sjc.vultrcr.com/chrisparsons/mutebetbot-bot:latest
    restart: unless-stopped
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DATABASE_URL: ${DATABASE_URL}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: production
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [db]
    # Exactly one bot process per token: two would double-apply timers.
    deploy: { replicas: 1 }

  web:
    image: sjc.vultrcr.com/chrisparsons/mutebetbot-web:latest
    restart: unless-stopped
    networks: [default, traefik]
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik
      traefik.http.routers.mutebetbot.rule: Host(`mutebetbot.flexspotff.com`)
      traefik.http.routers.mutebetbot.entrypoints: websecure
      traefik.http.routers.mutebetbot.tls: "true"
      traefik.http.services.mutebetbot.loadbalancer.server.port: "80"

networks:
  traefik:
    external: true
  # The network the existing Postgres container is on.
  db:
    external: true
    name: ${POSTGRES_NETWORK}
