server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Pages are built as /name/index.html; serve them at /name without a redirect.
  location / {
    try_files $uri $uri/index.html =404;
  }

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  location ~* \.(css|js|svg|png|jpg|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public";
  }
}
