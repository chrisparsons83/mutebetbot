name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mutebet
          POSTGRES_PASSWORD: mutebet
          POSTGRES_DB: mutebet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mutebet -d mutebet"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://mutebet:mutebet@localhost:5432/mutebet
      TEST_DATABASE_URL: postgres://mutebet:mutebet@localhost:5432/mutebet
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm db:migrate
      - run: pnpm test
      - run: pnpm web:build
        env:
          DISCORD_CLIENT_ID: '1557619779026554950'

  images:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build bot image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/bot/Dockerfile
          push: false
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          build-args: |
            DISCORD_CLIENT_ID=1557619779026554950
            PUBLIC_BASE_URL=https://mutebetbot.flexspotff.com
