name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: sjc.vultrcr.com/chrisparsons
  # Only pushes to main publish images and deploy.
  DEPLOY: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}

jobs:
  check:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mutebet
          POSTGRES_PASSWORD: mutebet
          POSTGRES_DB: mutebet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mutebet -d mutebet"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://mutebet:mutebet@localhost:5432/mutebet
      TEST_DATABASE_URL: postgres://mutebet:mutebet@localhost:5432/mutebet
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm db:migrate
      - run: pnpm test
      - run: pnpm web:build
        env:
          DISCORD_CLIENT_ID: ${{ vars.DISCORD_CLIENT_ID || '1557619779026554950' }}

  images:
    name: Build images
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Vultr Container Registry
        if: env.DEPLOY == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.VULTR_USERNAME }}
          password: ${{ secrets.VULTR_API_KEY }}
      - name: Bot image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/bot/Dockerfile
          push: ${{ env.DEPLOY == 'true' }}
          tags: |
            ${{ env.REGISTRY }}/mutebetbot-bot:latest
            ${{ env.REGISTRY }}/mutebetbot-bot:${{ github.sha }}
          cache-from: type=gha,scope=bot
          cache-to: type=gha,mode=max,scope=bot
      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: ${{ env.DEPLOY == 'true' }}
          tags: |
            ${{ env.REGISTRY }}/mutebetbot-web:latest
            ${{ env.REGISTRY }}/mutebetbot-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
          build-args: |
            DISCORD_CLIENT_ID=${{ vars.DISCORD_CLIENT_ID || '1557619779026554950' }}
            PUBLIC_BASE_URL=${{ vars.PUBLIC_BASE_URL || 'https://mutebetbot.flexspotff.com' }}

  deploy:
    name: Deploy to Vultr
    runs-on: ubuntu-latest
    needs: images
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Copy compose file to the server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          source: compose.prod.yaml
          target: mutebetbot
      - name: Pull and restart
        uses: appleboy/ssh-action@v1.2.0
        env:
          VULTR_USERNAME: ${{ secrets.VULTR_USERNAME }}
          VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          envs: VULTR_USERNAME,VULTR_API_KEY
          script: |
            set -e
            echo "$VULTR_API_KEY" | docker login sjc.vultrcr.com/chrisparsons -u "$VULTR_USERNAME" --password-stdin
            cd mutebetbot
            mv compose.prod.yaml compose.yaml
            docker compose pull
            docker compose up -d --remove-orphans
            # Idempotent: keeps the global slash commands in sync with this release.
            docker compose run --rm --no-deps bot node apps/bot/scripts/register-commands.ts --global
            docker image prune -f
